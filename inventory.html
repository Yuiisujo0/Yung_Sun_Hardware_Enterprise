<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Inventory | Admin</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>

<body class="bg-gray-100">
  <div id="navbar-root"></div>

  <main class="max-w-7xl mx-auto p-6 mt-20 space-y-6">
    <div class="flex justify-between items-center">
      <h1 class="text-2xl font-bold text-[#023f88]">Inventory Management</h1>
      <button onclick="openAddModal()"
        class="bg-orange-500 hover:bg-orange-600 text-white px-4 py-2 rounded-lg flex items-center gap-2">
        <i class="bx bx-plus"></i> Add Product
      </button>
    </div>

    <!-- Products Table -->
    <div class="bg-white rounded-xl shadow overflow-hidden">
      <div class="max-h-[500px] overflow-y-auto">
        <table class="w-full text-sm">
          <thead class="bg-gray-50 sticky top-0 z-10">
            <tr>
              <th class="p-4 text-left">Product</th>
              <th class="p-4 text-left">Description</th>
              <th class="p-4">Category</th>
              <th class="p-4">Price</th>
              <th class="p-4">Stock</th>
              <th class="p-4">Actions</th>
            </tr>
          </thead>
          <tbody id="inventoryTable"></tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Add Product Modal -->
<div id="addProductModal" class="fixed inset-0 bg-black/40 hidden flex items-center justify-center z-50 overflow-auto">
  <div class="bg-white rounded-xl w-full max-w-lg p-6 space-y-4 mx-4">
    <h2 class="text-lg font-bold text-[#023f88]">Add Product</h2>
    <input id="addProductName" class="w-full border p-2 rounded" placeholder="Product Name">
    <input id="addProductCategory" class="w-full border p-2 rounded" placeholder="Category">
    <textarea id="addProductDescription" class="w-full border p-2 rounded" placeholder="Product Description"></textarea>
    <div class="grid grid-cols-2 gap-3">
      <input id="addProductPrice" type="number" step="0.01" class="w-full border p-2 rounded" placeholder="Price (RM)">
      <input id="addProductStock" type="number" class="w-full border p-2 rounded" placeholder="Stock">
    </div>
    <input id="addProductImage" class="w-full border p-2 rounded" placeholder="Image URL">
    <div class="flex justify-end gap-2 pt-4">
      <button onclick="closeAddModal()" class="px-4 py-2 border rounded">Cancel</button>
      <button onclick="saveAddProduct()" class="px-4 py-2 bg-orange-500 hover:bg-orange-600 text-white rounded">Save Product</button>
    </div>
  </div>
</div>

<!-- Edit Product Modal -->
<div id="editProductModal" class="fixed inset-0 bg-black/40 hidden flex items-center justify-center z-50 overflow-auto">
  <div class="bg-white rounded-xl w-full max-w-lg p-6 space-y-4 mx-4">
    <h2 class="text-lg font-bold text-[#023f88]">Edit Product</h2>
    <input id="editProductName" class="w-full border p-2 rounded" placeholder="Product Name">
    <input id="editProductCategory" class="w-full border p-2 rounded" placeholder="Category">
    <textarea id="editProductDescription" class="w-full border p-2 rounded" placeholder="Product Description"></textarea>
    <div class="grid grid-cols-2 gap-3">
      <input id="editProductPrice" type="number" step="0.01" class="w-full border p-2 rounded" placeholder="Price (RM)">
      <input id="editProductStock" type="number" class="w-full border p-2 rounded" placeholder="Stock">
    </div>
    <input id="editProductImage" class="w-full border p-2 rounded" placeholder="Image URL">
    <div class="flex justify-end gap-2 pt-4">
      <button onclick="closeEditModal()" class="px-4 py-2 border rounded">Cancel</button>
      <button onclick="saveEditProduct()" class="px-4 py-2 bg-orange-500 hover:bg-orange-600 text-white rounded">Save Changes</button>
    </div>
  </div>
</div>


  <!-- Notification -->
<div id="notification" 
     class="fixed bottom-6 right-6 bg-green-600 text-white px-4 py-2 rounded shadow-lg hidden z-50">
  Update successful!
</div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/inventory.js"></script>
</body>
</html>
