<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sales Report | Yung Sun Hardware</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Boxicons -->
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <!-- jsPDF + html2canvas -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    .shadow-soft { box-shadow: 0 10px 25px rgba(0,0,0,0.08); }
    .text-primary { color: #023f88; }
  </style>
</head>
<body class="bg-gray-100 font-sans">

  <!-- Navbar placeholder -->
  <div id="navbar-root"></div>

  <main class="max-w-7xl mx-auto p-4 sm:p-6 space-y-8 mt-20">

    <!-- Page Header with Back Arrow and Export -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
      <div class="flex items-center gap-3">
        <a href="admin.html" class="text-[#f8941e] text-2xl hover:text-orange-600 transition" title="Back to Dashboard">
          <i class="bx bx-arrow-back"></i>
        </a>
        <h1 class="text-xl sm:text-2xl font-bold text-primary">Sales Report</h1>
      </div>
      <div class="flex gap-2 items-center flex-wrap">
        <label for="dateFilter" class="text-gray-600 text-sm">Duration:</label>
        <select id="dateFilter" class="border border-gray-300 rounded px-2 py-1 text-sm sm:text-base">
          <option value="7">Last 7 Days</option>
          <option value="30">Last 30 Days</option>
          <option value="90">Last 90 Days</option>
        </select>
        <button id="exportBtn" class="inline-flex items-center px-3 py-2 bg-[#f8941e] text-white rounded shadow hover:bg-orange-500 transition text-sm sm:text-base">
          <i class="bx bx-download mr-1"></i> Export PDF
        </button>
      </div>
    </div>

    <!-- Exportable content -->
    <div id="exportArea" class="space-y-6 bg-white rounded-2xl p-4 sm:p-6 shadow-soft">
      <!-- Inner wrapper for consistent padding -->
      <div class="px-4 sm:px-6" id="exportWrapper">

        <!-- Sales Trend Chart -->
        <section class="mb-6">
          <h2 class="text-lg sm:text-xl font-semibold mb-3">Sales Trend (RM)</h2>
          <div class="w-full overflow-x-auto">
            <canvas id="salesTrendChart" class="w-full h-64 sm:h-80"></canvas>
          </div>
        </section>

        <!-- Top Selling Products -->
        <section class="mb-6">
          <h2 class="text-lg sm:text-xl font-semibold mb-3">Top Selling Products</h2>
          <div class="overflow-x-auto">
            <table class="w-full text-sm sm:text-base">
              <thead class="bg-gray-50 text-gray-600">
                <tr>
                  <th class="p-2 sm:p-4 text-left">Product</th>
                  <th class="p-2 sm:p-4 text-left">Category</th>
                  <th class="p-2 sm:p-4 text-left">Quantity Sold</th>
                  <th class="p-2 sm:p-4 text-left">Revenue (RM)</th>
                </tr>
              </thead>
              <tbody id="topProductsTable"></tbody>
            </table>
          </div>
        </section>

        <!-- Sales by Date Table -->
        <section>
          <h2 class="text-lg sm:text-xl font-semibold mb-3">Sales by Date</h2>
          <div class="overflow-x-auto">
            <table class="w-full text-sm sm:text-base">
              <thead class="bg-gray-50 text-gray-600">
                <tr>
                  <th class="p-2 sm:p-4 text-left">Date</th>
                  <th class="p-2 sm:p-4 text-left">Orders</th>
                  <th class="p-2 sm:p-4 text-left">Total Sales (RM)</th>
                </tr>
              </thead>
              <tbody id="salesByDateTable"></tbody>
            </table>
          </div>
        </section>

      </div> <!-- end exportWrapper -->
    </div> <!-- end exportArea -->

  </main>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/navbar.js"></script>

  <script>
    const dateFilter = document.getElementById('dateFilter');
    const exportBtn = document.getElementById('exportBtn');

    async function fetchOrders(days = 7) {
      const fromDate = new Date();
      fromDate.setDate(fromDate.getDate() - days);
      const { data, error } = await supabaseClient
        .from('orders')
        .select('*')
        .gte('created_at', fromDate.toISOString())
        .order('created_at', { ascending: true });
      if (error) { console.error(error); return []; }
      return data;
    }

    async function loadSalesReport() {
      const days = Number(dateFilter.value);
      const orders = await fetchOrders(days);

      // Sales Trend Chart
      const salesChartData = {};
      orders.forEach(o => {
        const date = new Date(o.created_at).toLocaleDateString();
        salesChartData[date] = (salesChartData[date] || 0) + Number(o.total);
      });

      new Chart(document.getElementById('salesTrendChart'), {
        type: 'line',
        data: {
          labels: Object.keys(salesChartData),
          datasets: [{
            label: 'Sales (RM)',
            data: Object.values(salesChartData),
            borderColor: '#023f88',
            backgroundColor: 'rgba(2,63,136,0.15)',
            fill: true,
            tension: 0.4
          }]
        },
        options: { responsive: true, plugins: { legend: { display: false } } }
      });

      // Top Selling Products
      const productMap = {};
      orders.forEach(o => {
        if (!o.items) return;
        o.items.forEach(item => {
          if (!productMap[item.name]) productMap[item.name] = { ...item, quantity: 0, revenue: 0 };
          productMap[item.name].quantity += Number(item.quantity);
          productMap[item.name].revenue += Number(item.quantity) * Number(item.price);
        });
      });

      const topProducts = Object.values(productMap).sort((a,b) => b.quantity - a.quantity).slice(0, 10);
      const topProductsTable = document.getElementById('topProductsTable');
      topProductsTable.innerHTML = '';
      topProducts.forEach(p => {
        const tr = document.createElement('tr');
        tr.className = 'border-t hover:bg-gray-50';
        tr.innerHTML = `
          <td class="p-2 sm:p-4">${p.name}</td>
          <td class="p-2 sm:p-4">${p.category || 'N/A'}</td>
          <td class="p-2 sm:p-4 font-medium">${p.quantity}</td>
          <td class="p-2 sm:p-4 font-semibold">RM${p.revenue.toFixed(2)}</td>
        `;
        topProductsTable.appendChild(tr);
      });

      // Sales by Date Table
      const salesByDateTable = document.getElementById('salesByDateTable');
      salesByDateTable.innerHTML = '';
      for (const [date, total] of Object.entries(salesChartData)) {
        const orderCount = orders.filter(o => new Date(o.created_at).toLocaleDateString() === date).length;
        const tr = document.createElement('tr');
        tr.className = 'border-t hover:bg-gray-50';
        tr.innerHTML = `
          <td class="p-2 sm:p-4">${date}</td>
          <td class="p-2 sm:p-4 font-medium">${orderCount}</td>
          <td class="p-2 sm:p-4 font-semibold">RM${total.toFixed(2)}</td>
        `;
        salesByDateTable.appendChild(tr);
      }
    }

    dateFilter.addEventListener('change', loadSalesReport);
    loadSalesReport();

    // Export PDF functionality with proper padding and header
    exportBtn.addEventListener('click', async () => {
      const { jsPDF } = window.jspdf;
      const exportWrapper = document.getElementById('exportWrapper');

      // Temporary header for PDF
      const header = document.createElement('div');
      header.className = 'mb-6 text-center';
      const durationText = dateFilter.options[dateFilter.selectedIndex].text;
      header.innerHTML = `<h1 class="text-2xl font-bold text-primary">Sales Report</h1>
                          <p class="text-sm text-gray-600">Duration: ${durationText}</p>`;
      exportWrapper.prepend(header);

      const canvas = await html2canvas(exportWrapper, { scale: 2 });
      const imgData = canvas.toDataURL('image/png');

      const pdf = new jsPDF('p', 'mm', 'a4');
      const pdfWidth = pdf.internal.pageSize.getWidth();
      const pdfHeight = (canvas.height * pdfWidth) / canvas.width;

      pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
      pdf.save(`sales-report-${new Date().toLocaleDateString()}.pdf`);

      // Remove temporary header
      header.remove();
    });
  </script>

</body>
</html>
