<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sales Report | Yung Sun Hardware</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    .shadow-soft { box-shadow: 0 10px 25px rgba(0,0,0,0.08); }
    .text-primary { color: #023f88; }
  </style>
</head>
<body class="bg-gray-100 font-sans">
  <div id="navbar-root"></div>

  <main class="max-w-7xl mx-auto p-4 sm:p-6 space-y-8 mt-20">
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
      <div class="flex items-center gap-3">
        <a href="admin.html" class="text-[#f8941e] text-2xl hover:text-orange-600 transition" title="Back to Dashboard">
          <i class="bx bx-arrow-back"></i>
        </a>
        <h1 class="text-xl sm:text-2xl font-bold text-primary">Sales Report</h1>
      </div>
      <div class="flex gap-2 items-center flex-wrap">
        <label for="dateFilter" class="text-gray-600 text-sm">Duration:</label>
        <select id="dateFilter" class="border border-gray-300 rounded px-2 py-1 text-sm sm:text-base">
          <option value="7">Last 7 Days</option>
          <option value="30">Last 30 Days</option>
          <option value="90">Last 90 Days</option>
        </select>
        <button id="exportBtn" class="inline-flex items-center px-3 py-2 bg-[#f8941e] text-white rounded shadow hover:bg-orange-500 transition text-sm sm:text-base">
          <i class="bx bx-download mr-1"></i> Export PDF
        </button>
      </div>
    </div>

    <div id="exportArea" class="space-y-12">
      <!-- Sales Trend -->
      <section class="mb-6 bg-white rounded-2xl p-4 sm:p-6 shadow-soft">
        <h2 class="text-lg sm:text-xl font-semibold mb-3">Sales Trend (RM)</h2>
        <div class="w-full overflow-x-auto">
          <canvas id="salesTrendChart" class="w-full h-64 sm:h-80"></canvas>
        </div>
      </section>

      <!-- Top Selling Products -->
      <section class="mb-6 bg-white rounded-2xl shadow-soft p-4 sm:p-6">
        <h2 class="text-lg sm:text-xl font-semibold mb-4 mt-4">Top Selling Products</h2>
        <div class="overflow-x-auto overflow-y-auto max-h-100 border border-gray-300 rounded-lg shadow-sm bg-white">
          <table class="w-full text-sm sm:text-base border-collapse">
            <thead class="bg-[#023f88] text-white sticky top-0 z-10">
              <tr>
                <th class="p-2 sm:p-4 text-left">Product</th>
                <th class="p-2 sm:p-4 text-left">Category</th>
                <th class="p-2 sm:p-4 text-center">Quantity Sold</th>
                <th class="p-2 sm:p-4 text-center">Revenue (RM)</th>
              </tr>
            </thead>
            <tbody id="topProductsTable" class="divide-y"></tbody>
          </table>
        </div>
      </section>

      <!-- Sales by Date -->
      <section class="mb-6 bg-white rounded-2xl shadow-soft p-4 sm:p-6">
        <h2 class="text-lg sm:text-xl font-semibold mb-4 mt-4">Sales by Date</h2>
        <div class="overflow-x-auto overflow-y-auto max-h-100 border border-gray-300 rounded-lg shadow-sm bg-white">
          <table class="w-full table-fixed text-sm sm:text-base border-collapse">
            <thead class="bg-[#023f88] text-white sticky top-0 z-10">
              <tr>
                <th class="p-2 sm:p-4 text-center w-1/3">Date</th>
                <th class="p-2 sm:p-4 text-center w-1/3">Orders</th>
                <th class="p-2 sm:p-4 text-center w-1/3">Total Sales (RM)</th>
              </tr>
            </thead>
            <tbody id="salesByDateTable" class="divide-y"></tbody>
            </table>
          </div>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/sales.js"></script>
</body>
</html>
