<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --brand-orange: #f8941e; 
            --brand-blue: #023f88;   
            --cream-bg: #FDF9F0;
            --lavender: #B2A4FF;
        }

        body {
            background-color: var(--lavender);
            margin: 0; padding: 0;
            font-family: 'Arial Black', sans-serif;
            min-height: 200vh;
        }

        .spacer { height: 20px; width: 100%; }

        .nav-strip {
            width: 100%;
            border-top: 3px solid var(--brand-orange);
            position: sticky;
            top: 0;
            z-index: 1000;
            background-color: transparent;
            display: flex;
            padding: 0 40px;
            box-sizing: border-box;
            min-height: 60px;
        }

        .nav-items-wrapper {
            display: flex;
            width: 100%;
            justify-content: space-between;
            align-items: flex-start;
        }

        .nav-item {
            background-color: var(--cream-bg);
            border: 2px solid var(--brand-orange);
            color: var(--brand-blue);
            border-radius: 0 0 12px 12px; 
            border-top: none; 
            padding: 10px 18px;
            font-weight: 900;
            text-transform: uppercase;
            font-size: 13px;
            text-decoration: none;
            display: flex;
            align-items: center;
            transition: all 0.2s ease-in-out;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        /* --- LOGO IMAGE STYLING --- */
        .logo-img {
            height: 45px; /* Adjust this to make your logo bigger or smaller */
            width: auto;
            display: block;
            /* This ensures the logo stays visible even when the background flips to blue */
            filter: drop-shadow(0px 0px 0px transparent); 
            transition: filter 0.3s ease;
        }

        /* Optional: If your logo is orange, you might want it to turn white or 
           glow on hover when the background turns blue */
        .nav-item:hover .logo-img {
            filter: brightness(1.2); 
        }

        /* Hover & Active States */
        .nav-item:hover, .nav-item.is-active {
            background-color: var(--brand-blue);
            color: var(--brand-orange) !important;
            border-color: var(--brand-blue);
        }

        .nav-item svg {
            fill: var(--brand-blue);
            transition: fill 0.2s ease-in-out;
        }

        .nav-item:hover svg, .nav-item.is-active svg {
            fill: var(--brand-orange) !important;
        }

        /* Glisten Effect */
        .nav-item::after {
            content: '';
            position: absolute;
            top: 0; left: -150%;
            width: 100%; height: 100%;
            background: linear-gradient(120deg, transparent, rgba(255, 255, 255, 0.4), transparent);
        }
        .nav-item:hover::after {
            left: 150%;
            transition: left 0.6s ease-in-out;
        }

        .desktop-nav-group { display: flex; gap: 10px; margin-left: 10px; }
        .desktop-right-group { display: flex; gap: 10px; }
        .mobile-pill { display: none; gap: 8px; }
        .divider { border-left: 1px solid var(--brand-orange); height: 15px; margin: 0 4px; }

        @media (max-width: 950px) {
            .nav-strip { padding: 0 15px; }
            .desktop-nav-group {
                display: none; 
                flex-direction: column;
                position: absolute;
                top: 50px;
                right: 15px;
            }
            .desktop-nav-group.active { display: flex; }
            .desktop-nav-group .nav-item {
                border-top: 2px solid var(--brand-orange);
                border-radius: 8px;
                width: fit-content;
                align-self: flex-end;
            }
            .desktop-right-group { display: none; }
            .mobile-pill { display: flex; }
        }

        .hamburger-lines { display: flex; flex-direction: column; gap: 4px; }
        .hamburger-lines span { width: 18px; height: 3px; background-color: var(--brand-orange); }
    </style>
</head>
<body>

    <div class="spacer"></div>

    <header class="nav-strip">
        <div class="nav-items-wrapper">
            <a href="#" class="nav-item">
                <img src="assets/Yung_Sun_logo.png" alt="Myna Logo" class="logo-img">
            </a>
            
            <div class="desktop-nav-group" id="navLinks">
                <a href="#" class="nav-item">Snacks</a>
                <a href="#" class="nav-item">Gear</a>
                <a href="#" class="nav-item">Snack Lab</a>
                <a href="#" class="nav-item">Our Story</a>
            </div>

            <div class="desktop-right-group">
                <div class="nav-item" onclick="this.classList.toggle('is-active')">
                    <svg width="20" height="20" viewBox="0 0 24 24">
                        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                    </svg>
                </div>
                <a href="#" class="nav-item">CART 0</a>
            </div>

            <div class="nav-item mobile-pill" id="mobilePill">
                <div class="hamburger-lines" onclick="toggleMenu(event)">
                    <span></span><span></span><span></span>
                </div>
                <div class="divider"></div>
                <div style="display: flex; align-items: center;" onclick="toggleProfileMobile(event)">
                    <svg width="18" height="18" viewBox="0 0 24 24">
                        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                    </svg>
                </div>
                <div class="divider"></div>
                <span>🛒 0</span>
            </div>
        </div>
    </header>

    <script>
        function toggleMenu(e) {
            e.stopPropagation();
            document.getElementById('navLinks').classList.toggle('active');
        }
        function toggleProfileMobile(e) {
            e.stopPropagation();
            document.getElementById('mobilePill').classList.toggle('is-active');
        }
    </script>

</body>
</html>
