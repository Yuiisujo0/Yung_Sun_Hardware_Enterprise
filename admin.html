<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Yung Sun Hardware</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

  <style>
    .shadow-soft { box-shadow: 0 10px 25px rgba(0,0,0,0.08); }
    .text-primary { color: #023f88; }
    .bg-accent { background-color: #f8941e; }
    .bg-lowstock { background-color: #f72e2e; }
  </style>
</head>
<body class="bg-gray-100 font-sans">

  <div id="navbar-root"></div>

  <main class="max-w-7xl mx-auto p-6 mt-20 space-y-10">
    <div>
      <h1 class="text-3xl font-extrabold text-primary">Admin Dashboard</h1>
      <p class="text-gray-500">Quick overview of store stats</p>
    </div>

    <div class="flex flex-wrap gap-4">
      <a href="inventory.html" class="bg-[#023f88] text-white font-semibold px-6 py-3 rounded-xl shadow-soft hover:bg-blue-700 transition flex items-center gap-2">
        <i class="bx bx-package"></i> Manage Inventory
      </a>
      <a href="sales.html" class="bg-[#f8941e] text-white font-semibold px-6 py-3 rounded-xl shadow-soft hover:bg-orange-600 transition flex items-center gap-2">
        <i class="bx bx-line-chart"></i> View Sales Report
      </a>
    </div>

    <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
      <div class="relative bg-white rounded-2xl p-6 shadow-soft overflow-hidden">
        <i class="bx bx-money text-3xl text-accent absolute right-4 top-4"></i>
        <p class="text-gray-500">Total Sales</p>
        <h2 id="sales" class="text-3xl font-bold text-primary">RM0</h2>
      </div>
      <div class="relative bg-white rounded-2xl p-6 shadow-soft overflow-hidden">
        <i class="bx bx-receipt text-3xl text-primary absolute right-4 top-4"></i>
        <p class="text-gray-500">Orders</p>
        <h2 id="orders" class="text-3xl font-bold text-primary">0</h2>
      </div>
      <div class="relative bg-white rounded-2xl p-6 shadow-soft overflow-hidden">
        <i class="bx bx-package text-3xl text-primary absolute right-4 top-4"></i>
        <p class="text-gray-500">Products</p>
        <h2 id="products" class="text-3xl font-bold text-primary">0</h2>
      </div>
      <div class="relative bg-lowstock rounded-2xl p-6 shadow-soft text-white">
        <i class="bx bx-error text-3xl absolute right-4 top-4"></i>
        <p class="opacity-90">Low Stock</p>
        <h2 id="lowStock" class="text-3xl font-extrabold">0</h2>
      </div>
    </section>

    <section class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <div class="lg:col-span-2 bg-white rounded-2xl p-6 shadow-soft">
        <h3 class="font-semibold text-lg mb-4">Sales Trend</h3>
        <canvas id="salesChart"></canvas>
      </div>
      <div class="bg-white rounded-2xl p-6 shadow-soft">
        <h3 class="font-semibold text-lg mb-4">Order Status</h3>
        <canvas id="ordersChart"></canvas>
      </div>
    </section>

    <section class="bg-white rounded-2xl shadow-soft overflow-hidden">
      <div class="flex items-center justify-between p-6 border-b">
        <h3 class="font-semibold text-lg">Recent Orders</h3>
        <span class="text-sm text-gray-400">Last 7 days</span>
      </div>
      <table class="w-full text-sm">
        <thead class="bg-gray-50 text-gray-600">
          <tr>
            <th class="p-4">Order ID</th>
            <th class="p-4">Customer</th>
            <th class="p-4">Total</th>
            <th class="p-4">Status</th>
          </tr>
        </thead>
        <tbody id="ordersTable"></tbody>
      </table>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/navbar.js"></script>
  
  <script>
    async function requireAdmin() {
      if (!window.supabaseClient) return;

      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) return window.location.href = "signin.html";

      const { data } = await supabaseClient
        .from('profiles')
        .select('role')
        .eq('user_id', session.user.id)
        .single();

      if (data?.role !== 'admin') {
        return window.location.href = "index.html";
      }

      loadDashboard();
    }

  requireAdmin();

    async function fetchProducts() {
      const { data, error } = await supabaseClient.from('products').select('*');
      if (error) return [];
      return data;
    }

    async function fetchLowStockProducts() {
      const { data, error } = await supabaseClient.from('products').select('*').lt('stock', 5);
      if (error) return [];
      return data;
    }

    async function fetchOrders() {
      const { data, error } = await supabaseClient.from('orders').select('*').order('created_at', { ascending: false }).limit(7);
      if (error) return [];
      return data;
    }

    async function fetchTotalSales() {
      const { data, error } = await supabaseClient
        .from('orders')
        .select('total');
      if (error || !data) return 0;
      return data.reduce((sum, order) => sum + Number(order.total), 0);
    }

    async function loadDashboard() {
      const products = await fetchProducts();
      const lowStock = await fetchLowStockProducts();
      const orders = await fetchOrders();
      const totalSales = await fetchTotalSales();

      document.getElementById('products').textContent = products.length;
      document.getElementById('lowStock').textContent = lowStock.length;
      document.getElementById('orders').textContent = orders.length;
      document.getElementById('sales').textContent = `RM${totalSales.toFixed(2)}`;

      const table = document.getElementById('ordersTable');
      table.innerHTML = '';
      orders.forEach(o => {
        const tr = document.createElement('tr');
        tr.className = 'border-t hover:bg-gray-50';
        tr.innerHTML = `
          <td class="p-4 font-medium">${o.id}</td>
          <td class="p-4">${o.customer_name || 'N/A'}</td>
          <td class="p-4">$${o.total}</td>
          <td class="p-4 font-semibold ${o.status === 'Completed' ? 'text-green-600' : 'text-accent'}">${o.status}</td>
        `;
        table.appendChild(tr);
      });

      // Example charts
      new Chart(document.getElementById('salesChart'), {
        type: 'line',
        data: {
          labels: orders.map(o => new Date(o.created_at).toLocaleDateString()),
          datasets: [{
            data: orders.map(o => Number(o.total)),
            borderColor: '#023f88',
            backgroundColor: 'rgba(2,63,136,0.15)',
            fill: true,
            tension: 0.4
          }]
        },
        options: { plugins: { legend: { display: false } } }
      });

      const statusCounts = orders.reduce((acc, o) => {
        acc[o.status] = (acc[o.status] || 0) + 1;
        return acc;
      }, {});

      new Chart(document.getElementById('ordersChart'), {
        type: 'doughnut',
        data: {
          labels: Object.keys(statusCounts),
          datasets: [{ data: Object.values(statusCounts), backgroundColor: ['#023f88', '#f8941e', '#d1d5db'] }]
        },
        options: { cutout: '70%' }
      });
    }

    loadDashboard();
  </script>
</body>
</html>
