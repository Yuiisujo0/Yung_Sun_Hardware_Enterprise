<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop - Yung Sun Hardware</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Boxicons -->
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/shop.css">

</head>
<body class="bg-gray-100 font-sans">

  <div id="navbar-root"></div>
  <div class="h-20"></div>

  <!-- Shop Section -->
  <main class="max-w-7xl mx-auto py-12 px-6">
    <h2 class="text-4xl font-bold mb-10 text-center">Shop</h2>

    <div class="flex flex-col lg:flex-row gap-8">
      <!-- Sidebar -->
      <aside class="w-full lg:w-64 flex-shrink-0">
        <div class="bg-white p-6 rounded-xl shadow sticky top-28">
          <div class="flex items-center gap-2 mb-4 font-bold text-gray-800">
            <i class="bx bx-filter-alt"></i>
            <span>Categories</span>
          </div>
          <ul class="space-y-3 text-gray-600">
            <li><button class="w-full text-left px-3 py-2 rounded-lg bg-orange-50 text-orange-600 font-semibold">All</button></li>
            <li><button class="w-full text-left px-3 py-2 rounded-lg hover:bg-gray-100">Tools</button></li>
            <li><button class="w-full text-left px-3 py-2 rounded-lg hover:bg-gray-100">Fasteners</button></li>
            <li><button class="w-full text-left px-3 py-2 rounded-lg hover:bg-gray-100">Fittings</button></li>
            <li><button class="w-full text-left px-3 py-2 rounded-lg hover:bg-gray-100">Plumbing & Electrical</button></li>
            <li><button class="w-full text-left px-3 py-2 rounded-lg hover:bg-gray-100">Building Materials</button></li>
          </ul>
        </div>
      </aside>

      <!-- Product Grid -->
      <section class="flex-1">
        <!-- Search + Sort -->
        <div class="flex flex-col sm:flex-row gap-4 mb-6 items-center justify-between">

        <!-- Search -->
        <div class="relative w-full sm:w-1/2">
          <i class="bx bx-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
          <input
            id="searchInput"
            type="text"
            placeholder="Search products..."
            class="w-full pl-10 pr-4 py-2 border rounded-lg focus:ring-2 focus:ring-orange-400 outline-none"/>
          </div>

          <!-- Sort -->
          <select
            id="sortSelect"
            class="w-full sm:w-48 border rounded-lg px-3 py-2 focus:ring-2 focus:ring-orange-400 outline-none">
            <option value="">Sort by</option>
            <option value="price-asc">Price: Low → High</option>
            <option value="price-desc">Price: High → Low</option>
          </select>
        </div>

        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-8">
          <!-- Products inserted dynamically -->
        </div>
      </section>
    </div>
  </main>

  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Custom JS -->
  <script src="js/navbar.js"></script>
  <script src="js/shop.js"></script>

</body>
</html>
