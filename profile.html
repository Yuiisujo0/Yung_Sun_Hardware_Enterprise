<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - Yung Sun Hardware</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Boxicons -->
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

  <style>
    html { scroll-behavior: smooth; }

    .nav-link { position: relative; }
    .nav-link:hover { color: #f8941e; }
    .nav-link::after {
      content: "";
      position: absolute;
      width: 100%; height: 2px;
      bottom: -4px; left: 0;
      background-color: #f8941e;
      transform: scaleX(0);
      transform-origin: bottom right;
      transition: transform 0.3s ease-out;
    }
    .nav-link:hover::after {
      transform: scaleX(1);
      transform-origin: bottom left;
    }

    #mobileMenu { transition: transform 0.3s ease-in-out; }
    #mobileMenu.hidden { transform: translateY(-100%); }

    /* Avatar container for clickable profile picture */
    .avatar-container {
      position: relative;
      width: 96px; height: 96px;
      cursor: pointer;
    }
    .avatar-container img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #f8941e;
    }
    .avatar-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.3);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 24px;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .avatar-container:hover .avatar-overlay {
      opacity: 1;
    }
  </style>
</head>
<body class="bg-gray-100 font-sans">

  <!-- ================= NAVBAR ================= -->
  <nav id="navbar" class="fixed top-0 w-full bg-white z-50 transition-shadow duration-300">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center relative">
      <!-- Logo -->
      <div class="flex items-center gap-3">
        <a href="index.html" class="flex items-center gap-3">
          <img src="assets/Yung_Sun_logo3_round.png" alt="Yung Sun Hardware Logo" class="h-11 md:h-10 w-auto" />
        </a>
        <a href="index.html" class="hidden md:inline text-xl font-bold whitespace-nowrap">
          <span class="text-[#f8941e] font-extrabold">YUNG SUN</span>
          <span class="text-[#023f88]"> Hardware Enterprise</span>
        </a>
        <a href="index.html" class="md:hidden text-xl font-bold whitespace-nowrap">
          <span class="text-[#f8941e] font-extrabold">YUNG SUN</span>
        </a>
      </div>

      <!-- Desktop Menu -->
      <div class="hidden md:flex items-center gap-10 absolute left-1/2 -translate-x-1/2">
        <div class="relative group">
          <button class="flex items-center gap-2 font-medium hover:text-orange-500 transition-colors duration-300">
            <i class="bx bx-home text-lg"></i> Home
          </button>
          <div class="absolute top-8 left-0 bg-white shadow rounded w-40 opacity-0 visibility-hidden group-hover:opacity-100 group-hover:visibility-visible pointer-events-none group-hover:pointer-events-auto transition-all duration-300 ease-in-out delay-100">
            <a href="index.html#hero" class="block px-4 py-2 hover:bg-gray-100 nav-link">Home</a>
            <a href="index.html#about" class="block px-4 py-2 hover:bg-gray-100 nav-link">About</a>
            <a href="index.html#contact" class="block px-4 py-2 hover:bg-gray-100 nav-link">Contact</a>
          </div>
        </div>
        <a href="shop.html" class="flex items-center gap-2 font-medium hover:text-orange-500 transition-colors duration-300">
          <i class="bx bx-store text-lg"></i> Shop
        </a>
      </div>

      <!-- Right Icons -->
      <div class="ml-auto flex items-center gap-6 text-xl">
        <div class="hidden md:flex items-center gap-6">
          <a href="profile.html" aria-label="User Profile">
            <i class="bx bx-user cursor-pointer hover:text-orange-500 transition-colors duration-300 transform hover:scale-110"></i>
          </a>
          <i class="bx bx-cart cursor-pointer hover:text-orange-500 transition-colors duration-300 transform hover:scale-110"></i>
        </div>

        <!-- Mobile Hamburger -->
        <div class="md:hidden flex items-center gap-4">
          <i class="bx bx-cart cursor-pointer hover:text-orange-500 transition-colors duration-300 transform hover:scale-110"></i>
          <button id="menuBtn" class="text-3xl"><i class="bx bx-menu"></i></button>
        </div>
      </div>
    </div>
  </nav>

  <!-- ================= MOBILE MENU ================= -->
  <div id="mobileMenu" class="hidden fixed top-16 w-full bg-white shadow-md md:hidden z-40 overflow-hidden transition-all duration-300 ease-in-out transform -translate-y-full">
    <a href="index.html#hero" class="block px-6 py-4 hover:bg-gray-100 nav-link transition-colors duration-300">Home</a>
    <a href="index.html#about" class="block px-6 py-4 hover:bg-gray-100 nav-link transition-colors duration-300">About</a>
    <a href="index.html#contact" class="block px-6 py-4 hover:bg-gray-100 nav-link transition-colors duration-300">Contact</a>
    <a href="shop.html" class="block px-6 py-4 hover:bg-gray-100 transition-colors duration-300">Shop</a>
    <a href="profile.html" class="block px-6 py-4 hover:bg-gray-100 transition-colors duration-300">Profile</a>
  </div>

  <div class="h-10"></div> <!-- Spacer -->

  <!-- ================= PROFILE CONTENT ================= -->
  <main class="max-w-3xl mx-auto py-12 px-6 space-y-10">

    <h2 class="text-4xl font-bold text-center text-gray-800">Your Profile</h2>

    <!-- Avatar & Info Card -->
    <div class="bg-white p-8 rounded-2xl shadow-xl flex flex-col items-center space-y-6 transition-transform hover:scale-[1.01]">

        <!-- Top: Profile Title + Edit Button -->
        <div class="flex justify-between w-full items-center mb-4">
        <h3 class="text-xl font-semibold">Profile Information</h3>
        <button id="editBtn" class="bg-orange-500 hover:bg-orange-600 text-white py-2 px-4 rounded-md transition-all">
            Edit
        </button>
        </div>

        <!-- Avatar Upload -->
        <div class="avatar-container">
        <img id="userAvatar" src="assets/default-avatar.jpg" alt="Profile Picture">
        <div class="avatar-overlay"><i class="bx bx-camera"></i></div>
        </div>
        <input type="file" id="avatarInput" class="hidden" accept="image/*">

        <!-- User Info -->
        <div class="w-full max-w-md space-y-4 text-gray-700">
        <div class="flex justify-between border-b pb-2">
            <span class="font-semibold">Email:</span> 
            <span id="userEmail" class="truncate max-w-[250px]">Loading...</span>
        </div>
        <div class="flex justify-between border-b pb-2">
            <span class="font-semibold">Full Name:</span> 
            <span id="userName" class="truncate max-w-[250px]">Not set</span>
        </div>
        <div class="flex justify-between border-b pb-2">
            <span class="font-semibold">Phone:</span> 
            <span id="userPhone" class="truncate max-w-[250px]">Not set</span>
        </div>
        <div class="flex flex-col border-b pb-2">
            <span class="font-semibold mb-1">Shipping Address:</span> 
            <span id="userAddress" class="break-words w-full max-w-full">Not set</span>
        </div>
        </div>

        <!-- Log Out Button -->
        <button id="logoutBtn" class="mt-4 bg-red-500 hover:bg-red-600 text-white py-2 px-4 rounded-md shadow-md hover:shadow-lg transition-all">
        Log Out
        </button>
    </div>

    </main>

  <!-- ================= SUPABASE SCRIPT ================= -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
    const SUPABASE_URL = 'https://clhzzjugjttqidiuolrj.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_X8iVVZsZGbS9h_EKCds1wg_02UyKnpS';
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    (async () => {
        const { data: { session } } = await client.auth.getSession();
        if (!session) return window.location.href = 'signin.html';

        const userId = session.user.id;

        // Show user info
        document.getElementById('userEmail').textContent = session.user.email;

        // Load extra info from 'profiles' table
        const { data, error } = await client.from('profiles')
        .select('*')
        .eq('user_id', userId)
        .single();

        if (error) {
        console.error('Error loading profile:', error);
        } else if (data) {
        document.getElementById('userName').textContent = data.full_name || 'Not set';
        document.getElementById('userPhone').textContent = data.phone || 'Not set';
        document.getElementById('userAddress').textContent = data.address || 'Not set';
        if (data.avatar_url) document.getElementById('userAvatar').src = data.avatar_url;
        }

        // Avatar upload
        const avatarInput = document.getElementById('avatarInput');
        const userAvatar = document.getElementById('userAvatar');
        const avatarContainer = document.querySelector('.avatar-container');

        avatarContainer.addEventListener('click', () => avatarInput.click());

        avatarInput.addEventListener('change', async (event) => {
        const file = event.target.files[0];
        if (!file) return;

        try {
            const fileExt = file.name.split('.').pop();
            const fileName = `avatar.${fileExt}`;
            const filePath = `${userId}/${fileName}`; // Must match storage policy

            // Upload file to bucket
            const { error: uploadError } = await client.storage.from('avatars').upload(filePath, file, { upsert: true });
            if (uploadError) throw uploadError;

            // Get public URL
            const { data: publicData, error: urlError } = client.storage.from('avatars').getPublicUrl(filePath);
            if (urlError) throw urlError;
            const publicUrl = publicData.publicUrl;

            // Update profile table (RLS-safe)
            const { error: updateError } = await client.from('profiles')
            .update({ avatar_url: publicUrl })
            .eq('user_id', userId);
            if (updateError) throw updateError;

            // Update avatar on page
            userAvatar.src = publicUrl;
            console.log('Avatar updated successfully!');
        } catch (err) {
            console.error('Avatar upload failed:', err);
            alert('Upload failed! Check console for details.');
        }
        });

        // Log out
        document.getElementById('logoutBtn').addEventListener('click', async () => {
        await client.auth.signOut();
        window.location.href = 'index.html';
        });

        // ================= Inline Editing =================
        const editBtn = document.getElementById('editBtn');
        let isEditing = false;
        const fields = ['userName', 'userPhone', 'userAddress'];

        editBtn.addEventListener('click', async () => {
        isEditing = !isEditing;

        if (isEditing) {
            editBtn.textContent = 'Save';

            fields.forEach(id => {
            const span = document.getElementById(id);
            const value = span.textContent === 'Not set' ? '' : span.textContent;
            const input = document.createElement('input');

            // Make shipping address bigger
            if (id === 'userAddress') {
                input.type = 'text';
                input.value = value;
                input.id = id;
                input.className = 'border rounded-md px-3 py-2 w-full text-gray-700';
            } else {
                input.type = 'text';
                input.value = value;
                input.id = id;
                input.className = 'border rounded-md px-2 py-1 w-64 text-gray-700';
            }

            span.replaceWith(input);
            });

        } else {
            editBtn.textContent = 'Edit';
            const updatedData = {};

            fields.forEach(id => {
            const input = document.getElementById(id);
            updatedData[id] = input.value;

            const span = document.createElement('span');
            span.id = id;
            span.textContent = input.value || 'Not set';
            span.className = (id === 'userAddress') ? 'break-words w-full max-w-full' : 'truncate max-w-[250px]';

            input.replaceWith(span);
            });

            try {
            await client.from('profiles').update({
                full_name: updatedData.userName,
                phone: updatedData.userPhone,
                address: updatedData.userAddress
            }).eq('user_id', userId);
            console.log('Profile updated successfully!');
            } catch (err) {
            console.error('Failed to update profile:', err);
            alert('Failed to save changes. Check console.');
            }
        }
        });
    })();  

    // ================= NAVBAR JS =================
    const navbar = document.getElementById("navbar");
        const menuBtn = document.getElementById("menuBtn");
        const mobileMenu = document.getElementById("mobileMenu");
        const sections = document.querySelectorAll("section");
        const navLinks = document.querySelectorAll(".nav-link");
        const dropdownButton = document.querySelector(".group");
        const dropdownMenu = dropdownButton.querySelector("div");
        const tabButtons = document.querySelectorAll(".tab-btn");
        const tabContents = document.querySelectorAll(".tab-content");

        // Navbar shadow on scroll
        window.addEventListener("scroll", () => {
        if (window.scrollY > 10) {
            navbar.classList.add("shadow-md");
        } else {
            navbar.classList.remove("shadow-md");
        }
        });

        // Toggle the mobile menu with smooth sliding animation
        menuBtn.addEventListener("click", () => {
            // Toggle the hidden class and animation to slide the mobile menu in/out
            mobileMenu.classList.toggle("hidden");
            mobileMenu.classList.toggle("-translate-y-full"); // Slide down on toggle
        });

        // Dropdown hover effects
        dropdownButton.addEventListener("mouseenter", () => {
        dropdownMenu.classList.add("opacity-100", "visibility-visible", "pointer-events-auto");
        dropdownMenu.classList.remove("opacity-0", "visibility-hidden", "pointer-events-none");
        });

        dropdownButton.addEventListener("mouseleave", () => {
        setTimeout(() => {
            if (!dropdownMenu.matches(':hover')) {
            dropdownMenu.classList.add("opacity-0", "visibility-hidden", "pointer-events-none");
            dropdownMenu.classList.remove("opacity-100", "visibility-visible", "pointer-events-auto");
            }
        }, 100);
        });

        dropdownMenu.addEventListener("mouseenter", () => {
        dropdownMenu.classList.add("opacity-100", "visibility-visible", "pointer-events-auto");
        dropdownMenu.classList.remove("opacity-0", "visibility-hidden", "pointer-events-none");
        });

        dropdownMenu.addEventListener("mouseleave", () => {
        dropdownMenu.classList.add("opacity-0", "visibility-hidden", "pointer-events-none");
        dropdownMenu.classList.remove("opacity-100", "visibility-visible", "pointer-events-auto");
        });

        // Active link highlight
        window.addEventListener("scroll", () => {
        let current = "";
        sections.forEach(section => {
            const sectionTop = section.offsetTop - 120;
            if (scrollY >= sectionTop) current = section.getAttribute("id");
        });
        navLinks.forEach(link => {
            link.classList.remove("text-orange-600", "font-semibold");
            if (link.getAttribute("href") === `#${current}`) {
            link.classList.add("text-orange-600", "font-semibold");
            }
        });
        });

        tabButtons.forEach(btn => {
        btn.addEventListener("click", () => {
            // Remove active state
            tabButtons.forEach(b => b.classList.remove("active-tab"));
            tabContents.forEach(c => c.classList.add("hidden"));

            // Activate selected tab
            btn.classList.add("active-tab");
            document.getElementById(btn.dataset.tab).classList.remove("hidden");
        });
        });
   </script>

  </body>
</html>
